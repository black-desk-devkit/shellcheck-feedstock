context:
  version: "0.11.0"

package:
  name: shellcheck
  version: ${{ version }}

source:
  url: https://github.com/koalaman/shellcheck/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8b07554f92e4fbfc33f1539a1f475f21c6503ceae8f806efcc518b1f529f7102

build:
  number: 0
  skip: win
  dynamic_linking:
    overlinking_behavior: error
    overdepending_behavior: error
  script:
    - set -x
    - echo "=== /lib64 ==="; ls -la /lib64/ || true
    - echo "=== ldconfig libc ==="; ldconfig -p | grep libc.so || true
    - echo "=== GHC settings ==="; find $BUILD_PREFIX -name "settings" -path "*ghc*" -exec cat {} \; || true
    - echo "=== all libc.so ==="; find $BUILD_PREFIX -name "libc.so*" -exec sh -c 'echo "--- $1"; file "$1"' _ {} \; || true
    - echo "=== env ==="; env | grep -iE 'CC|LD|LIBRARY|SYSROOT|CONDA' | sort || true
    - cabal update
    - cabal configure --disable-shared --disable-executable-dynamic --disable-library-for-ghci --ghc-options="-optl--sysroot=$CONDA_BUILD_SYSROOT"
    - cabal build -v3 exe:shellcheck
    - cabal install exe:shellcheck --installdir=$PREFIX/bin --install-method=copy

requirements:
  build:
    - ghc
    - cabal
  run: []

tests:
  - script:
      - shellcheck --version

about:
  homepage: https://www.shellcheck.net/
  summary: ShellCheck, a static analysis tool for shell scripts
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/koalaman/shellcheck

extra:
  recipe-maintainers:
    - black-desk
